; Intellar-Engine-Simulator — affichage PC (API Drivers::LCD compatible Engine).
; Build recommandé : CMake (SDL2 via FetchContent). Voir README.md.
;
; PlatformIO native (nécessite SDL2 installé, ex. MSYS2 ucrt64) :
;   pacman -S mingw-w64-ucrt-x86_64-SDL2

[env:sim]
platform = native
build_flags =
    -std=gnu++17
    -I include
    -DSDL_MAIN_HANDLED
    -DENGINE_SIM=1
build_src_filter =
    +<src/Drivers/LCD.cpp>
    +<sim/main.cpp>
lib_ldf_mode = off
; Décommenter et adapter si SDL2 est dans MSYS2 ucrt64 :
; build_flags =
;     ${env.build_flags}
;     -IC:/msys64/ucrt64/include/SDL2
;     -LC:/msys64/ucrt64/lib
;     -lSDL2
